[workspace]
members = [
    "crates/handclip-agent",
    "crates/handclip-cli",
    "crates/handclip-core",
    "crates/handclip-relay",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1.0"
arboard = "3.6"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
global-hotkey = "0.8"
image = { version = "0.25", default-features = false, features = ["png"] }
notify-rust = "=4.11.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tao = "0.35"
thiserror = "2.0"
tokio = { version = "1.47", features = ["full"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tray-icon = "0.24"
uuid = { version = "1.17", features = ["serde", "v4"] }
wry = "0.55"
